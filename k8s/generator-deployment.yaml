apiVersion: apps/v1
kind: Deployment
metadata:
  name: generator-deployment
  labels:
    app: soc-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: soc-generator
  template:
    metadata:
      labels:
        app: soc-generator
    spec:
      containers:
      - name: generator
        image: soc-simulation-project-generator:latest
        imagePullPolicy: Never
        env:
        - name: API_URL
          value: "http://engine-service:8000/alerts"