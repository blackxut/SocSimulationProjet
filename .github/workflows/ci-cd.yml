name: SOC Application CI/CD Pipeline

# Déclencheurs du pipeline
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Récupération du code source
      - name: Checkout repository
        uses: actions/checkout@v4

      # Étape 2 : Configuration de Docker Buildx (pour des builds plus rapides)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Étape 3 : Build de l'image Engine (FastAPI)
      - name: Build Engine Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./engine
          file: ./engine/Dockerfile
          push: false # Ne pousse pas sur un registre distant pour l'instant (test local au pipeline)
          tags: soc-engine:test

      # Étape 4 : Build de l'image Dashboard (Streamlit)
      - name: Build Dashboard Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          push: false
          tags: soc-dashboard:test

      # Étape 5 : Build de l'image Generator (Log generator)
      - name: Build Generator Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./generator
          file: ./generator/Dockerfile
          push: false
          tags: soc-generator:test

      # Étape 6 : Test de validation globale via Docker Compose
      - name: Test Docker Compose Orchestration
        run: |
          docker compose config
          docker compose build